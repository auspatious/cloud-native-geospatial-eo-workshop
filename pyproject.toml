[project]
name = "cloud-native-geo-for-eo"
version = "0.1.0"
description = "Cloud Native Geospatial for Earth Observation Workshop"
requires-python = ">=3.12"
dependencies = [
    "bokeh>=3.9.2",
    "botocore>=1.43.56",
    "dask[distributed]>=2026.7.1",
    "folium>=0.20.0",
    "geopandas>=1.1.4",
    "ipykernel>=7.3.0",
    "ipyleaflet>=0.20.0",
    "mapclassify>=2.10.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "odc-geo>=0.5.3",
    "odc-loader>=0.6.4",
    "odc-stac>=0.5.3",
    "planetary_computer>=1.0.0",
    "pystac>=1.15.2",
    "pystac-client>=0.9.0",
    "rustac>=0.9.16",
    "s3fs>=2026.7.0",
    "scikit-learn>=1.9.0",
    "xarray>=2026.07.0",
    "zarr>=3.3.0",
]

[tool.uv]
package = false
